schema_version = "1.3"
artifacts = ["/workspace/output"]

[metadata]
task_id = "erp-mock-budget-scheme-smoke"
task_version = "0.1.0"
domain = "finance"
subdomain = "budget_control"
role = "budget-analyst"
difficulty = "easy"
interaction = "api"
split = "dev"
scenario_family = "erp-mcp-connectivity"
data_source = "offline-erp-mock"
language = "zh-CN"

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 60

[environment]
build_timeout_sec = 300
cpus = 1
memory_mb = 1024
storage_mb = 2048

# 经每个 trial 的 MCP 代理 sidecar（configs/compose/mcp-proxy.yaml）访问 ERP；
# LG_MCP_TARGET=mock（代理默认）时转发到离线 mock（configs/compose/erp-mock-mcp.yaml，
# 评测实例 erp-benchmark，随 Hugging Face 题集发布，见 datasets/README.md）。
# 这里只写代理地址，密钥与上游由代理注入。
# 本题不挂白名单片段，走实例的 default_dataset（bgt-05）。
[[environment.mcp_servers]]
name = "erp"
transport = "streamable-http"
url = "http://lg-mcp-proxy:18090/mcp"
