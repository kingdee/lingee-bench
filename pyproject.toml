[project]
name = "lg-benchmark"
version = "0.1.0"
description = "Enterprise management agent benchmark built on Harbor"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["harbor==0.22.0"]

[project.scripts]
lg-bench = "lg_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lg_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
