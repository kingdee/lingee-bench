schema_version = "1.4"
multi_step_reward_strategy = "final"

[task]
name = "lg-bench/native-session-smoke"
version = "0.1.0"
description = "工程冒烟：验证原生会话身份、无工具的跨轮记忆及 ATIF，不计入业务题集。"

[agent]
timeout_sec = 180

[verifier]
timeout_sec = 30
environment_mode = "shared"

[environment]
build_timeout_sec = 300
cpus = 1
memory_mb = 2048
storage_mb = 2048
workdir = "/workspace"

[[steps]]
name = "round-1"
[steps.verifier.env]
LG_SMOKE_ROUND = "1"

[[steps]]
name = "round-2"
[steps.verifier.env]
LG_SMOKE_ROUND = "2"
