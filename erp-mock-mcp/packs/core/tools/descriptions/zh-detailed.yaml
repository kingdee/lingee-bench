# zh-detailed 描述（tool-design.md 第 3 节）：tools/list 中的工具描述与参数描述逐字取自这里
# （需求 3 第 7 条）。每个工具按功能、适用范围、前置条件、副作用、返回五项书写，工具描述不超过
# 400 个码位；每个顶层参数都要有描述，缺一个加载第 7 步就报错（需求 3 第 2、3 条）。
#
# 这里的工具名是应用 tools/exposure.yaml 之后的名字：department_search 与 employee_search
# 被 exclude 去掉，所以本文件没有它们的条目（需求 11 第 1 条）。
#
# 两条禁令（需求 3 第 4、5 条）：不出现引导性用语；不出现初始数据集中实体记录的名称、编码和
# 单据编号——加载第 8 步之后会把每条描述与数据集里的业务数据逐一比对，比对按子串、ASCII 字母
# 不区分大小写进行。本包共享数据里的编码（组织、部门、员工、计量单位、仓库的编码）都很短，
# 所以描述里一律不写具体取值；需要举例时取 seed/examples/ 中的示例数据。
variant: zh-detailed
tools:
  material_search:
    description: |-
      按关键字、物料类型和状态分页检索物料，返回物料摘要。
      如需查看基本单位、采购单位、税率和单位换算关系，请使用 material_get。
      前置条件：无。
      副作用：无，只读。
      返回：items（每项含 id、code、name、status、spec、kind）、total、page、page_size、has_more；按 code 升序排列，id 为最后排序键。status 为 disabled 的物料不能写入新单据。
    params:
      keyword: 关键字，按包含匹配 code、name 或 spec，ASCII 字母不区分大小写；不填或为空字符串时不按关键字过滤
      kind: 物料类型，raw 为原材料，finished 为产成品，goods 为商品；不填时返回全部类型
      status: 状态，enabled 为启用，disabled 为停用；不填时返回全部状态
      page: 页码，从 1 开始；不填时为 1
      page_size: 每页条数，1 到 100；不填时为 20
  material_get:
    description: |-
      按内部 ID 获取单个物料的全部字段，以及它的全部单位换算关系。
      如需按名称、编码或规格型号查找物料，请使用 material_search。
      前置条件：id 由 material_search 返回。
      副作用：无，只读。
      返回：物料的 id、code、status、name、spec、kind、base_unit（基本单位，即时库存与分录的 qty_base 按它计量）、purchase_unit（采购单位，采购单据分录的计量单位缺省取它）、tax_rate、standard_cost，以及 unit_conversions 数组，每项含 from_unit 与 factor，表示 1 个 from_unit 折合 factor 个基本单位。
    params:
      id: 物料的内部 ID，由 material_search 返回
  supplier_search:
    description: |-
      按关键字和状态分页检索供应商，返回供应商摘要。
      如需查看账期天数和缺省税率，请使用 supplier_get。
      前置条件：无。
      副作用：无，只读。
      返回：items（每项含 id、code、name、status、short_name）、total、page、page_size、has_more；按 code 升序排列，id 为最后排序键。status 为 disabled 的供应商不能写入新单据。
    params:
      keyword: 关键字，按包含匹配 code、name 或 short_name，ASCII 字母不区分大小写；不填或为空字符串时不按关键字过滤
      status: 状态，enabled 为启用，disabled 为停用；不填时返回全部状态
      page: 页码，从 1 开始；不填时为 1
      page_size: 每页条数，1 到 100；不填时为 20
  supplier_get:
    description: |-
      按内部 ID 获取单个供应商的全部字段。
      如需按名称、编码或简称查找供应商，请使用 supplier_search。
      前置条件：id 由 supplier_search 返回。
      副作用：无，只读。
      返回：供应商的 id、code、status、name、short_name、payment_term_days（账期天数）和 default_tax_rate（缺省税率）。default_tax_rate 只是供应商自身的属性，采购单据分录的税率缺省取物料的 tax_rate。
    params:
      id: 供应商的内部 ID，由 supplier_search 返回
  warehouse_search:
    description: |-
      按关键字和状态分页检索仓库，返回仓库摘要。
      需要填写仓库的单据，在调用写工具之前用它取得仓库的内部 ID；本业务包不提供按内部 ID 获取单个仓库的工具，仓库的全部字段就是摘要里的这四项。
      前置条件：无。
      副作用：无，只读。
      返回：items（每项含 id、code、name、status）、total、page、page_size、has_more；按 code 升序排列，id 为最后排序键。status 为 disabled 的仓库不能写入新单据。
    params:
      keyword: 关键字，按包含匹配 code 或 name，ASCII 字母不区分大小写；不填或为空字符串时不按关键字过滤
      status: 状态，enabled 为启用，disabled 为停用；不填时返回全部状态
      page: 页码，从 1 开始；不填时为 1
      page_size: 每页条数，1 到 100；不填时为 20
