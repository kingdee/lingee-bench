# 包级测试用例：联动 stock_move_inventory（transfer 方向）的回放用例（需求 21 第 9 条）。
#
# setup 用 `status: approved` 的收料单建出期初库存：构建时引擎依次执行 create、submit、
# approve，审核时按 goods_entry_inventory 联动在 D001 增加 500 PCS（需求 20 第 2 条）。
# 这也是 M0 未暴露某个操作的工具时写用例的办法——setup 直接写目标状态。
#
# 回放：建草稿、提交、审核，审核时 transfer 联动在 D001 写 -60、在 D002 写 +60 两条流水，
# 随后两次即时库存查询核对两个仓库的余额。每一步之后执行器都检查
# INV-1、INV-2、INV-3、INV-6，所以联动没写流水或余额与流水不符都会在该步报出。
#
# 内部 ID：共享数据的仓库为 dep_000001（D001）、dep_000002（D002），计量单位为
# msr_000001（PCS）；setup 的存货为 art_000001，收料单为 ge_000001（见别名映射）。
# 第 1 步新建的移库单用 alias 绑定为 stock_move:moved，后两步用 $stock_move:moved 引用。
#
# 日期的写法不同：setup 里写相对锚点日期的表达式（month(0).day(1)），步骤的参数只接受
# YYYY-MM-DD 的真实日期，不填时取当前业务日期，即锚点日期（需求 16 第 2 条）。
case: stock-move-transfer
anchor_date: 2026-10-09
setup:
  vendor:origin:
    kind: vendor
    name: 回放用例专用供货单位
    short_name: 回放供货
    pay_days: 30
  article:part:
    kind: article
    name: 回放用例专用紧固件
    spec: M10X50
    grade: fine
    base_measure: PCS
    tax_rate: "0.13"
  goods_entry:opening:
    kind: goods_entry
    vendor: "vendor:origin"
    biz_date: month(0).day(1)
    status: approved
    lines:
      - { article: "article:part", measure: PCS, entry_qty: "500", depot: D001 }
steps:
  - call: stock_move_draft_create
    args:
      from_depot_id: dep_000001
      to_depot_id: dep_000002
      lines:
        - { article_id: "$article:part", measure_id: msr_000001, move_qty: "60" }
    alias: stock_move:moved
    expect:
      result:
        status: draft
        lines:
          - { line_no: 1, move_qty: "60", qty_base: "60" }
  - call: stock_move_submit
    args: { id: "$stock_move:moved" }
    expect: { result: { status: submitted } }
  - call: stock_move_approve
    args: { id: "$stock_move:moved" }
    expect: { result: { status: approved } }
  # 调出仓：500 - 60
  - call: stock_level_query
    args: { material_id: "$article:part", warehouse_id: dep_000001 }
    expect:
      result:
        total: 1
        items:
          - { warehouse: { id: dep_000001, code: D001 }, qty_base: "440" }
  # 调入仓：0 + 60
  - call: stock_level_query
    args: { material_id: "$article:part", warehouse_id: dep_000002 }
    expect:
      result:
        total: 1
        items:
          - { warehouse: { id: dep_000002, code: D002 }, qty_base: "60" }
