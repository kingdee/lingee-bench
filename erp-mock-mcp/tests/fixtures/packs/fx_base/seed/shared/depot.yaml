# 仓库：depot 声明了 code 生成规则（prefix D、digits 3），编码由引擎按创建顺序分配，
# 因此这里不写 code（写入只读字段会使构建失败，需求 20 第 6 条）。
# 内部 ID 依次为 dep_000001、dep_000002，编码依次为 D001、D002。
# branch 是去掉 _id 后缀书写的引用，值为 branch 的编码（需求 20 第 16 条）；
# 文件名排在 branch.yaml 之后，所以被引用的组织已经创建（需求 20 第 17 条）。
records:
  - { kind: depot, name: 夹具主料仓, branch: BR01 }
  - { kind: depot, name: 夹具辅料仓, branch: BR01 }
